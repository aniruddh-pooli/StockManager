services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "trades", "--partitions", "1", "--replication-factor", "1"]

  producer:
    build:
      context: .
      dockerfile: Dockerfile.python
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "risk_engine.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PRODUCER_INTERVAL_SECONDS: ${PRODUCER_INTERVAL_SECONDS:-1}
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[2]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.5
      - /opt/risk_engine/stream.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      RISK_DB_PATH: /app/data/risk.db
      SPARK_LOCAL_HOSTNAME: localhost
      PYSPARK_PYTHON: python3
      MC_SCENARIOS: ${MC_SCENARIOS:-5000}
      RISK_LOOKBACK_TICKS: ${RISK_LOOKBACK_TICKS:-60}
    volumes:
      - ./data:/app/data
      - ./checkpoints:/app/checkpoints
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.python
    command: ["python", "-m", "dashboard.server"]
    environment:
      RISK_DB_PATH: /app/data/risk.db
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      - spark
    restart: unless-stopped

